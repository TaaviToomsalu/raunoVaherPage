<!DOCTYPE html>
<html>
  <head>
    <title>Snipcart templates</title>
  </head>
  <body>
    <!-- Snipcarti malli-ülekirjutused (vt window.SnipcartSettings.templatesUrl).
         Iga ülekirjutatud komponent vajab täpselt ühte juurelementi. -->
    <div id="snipcart-templates">

      <!--Checkout'i päise sektsioon: säilitame vaike cart-headeri ja
           lisame selge "tagasi saidile" nupu (close-cart-action), mis
           jääb nähtavaks ka maksejärgse kinnitusekraani peale. -->
      <checkout section="header">
        <div class="root rv-checkout-header">
          <close-cart-action class="rv-cart-close">
            <icon name="back-arrow" class="rv-cart-close__icon"></icon>
            <span class="rv-cart-close__title">
              {{ $localize('actions.continue_shopping') }}
            </span>
          </close-cart-action>

          <cart-header
            class="snipcart-checkout__header"
            :show-items-count="false"
            :show-summary="true"
            :show-account-menu="showAccountMenu"
            @summaryOpened="summaryOpened"
            @summaryClosed="summaryClosed"
          >
          </cart-header>
        </div>
      </checkout>

      <!-- Maksejärgne kinnitusekraan (order-komponent) — sama "tagasi
           saidile" nupp ka siia, muidu jääb klient pärast makset lõksu. -->
      <order section="header">
        <div class="root rv-checkout-header">
          <close-cart-action class="rv-cart-close">
            <icon name="back-arrow" class="rv-cart-close__icon"></icon>
            <span class="rv-cart-close__title">
              {{ $localize('actions.continue_shopping') }}
            </span>
          </close-cart-action>

          <cart-header
            class="snipcart-checkout__header"
            :show-items-count="false"
            :show-summary="false"
            :show-account-menu="false"
          >
          </cart-header>
        </div>
      </order>

    </div>
  </body>
</html>
